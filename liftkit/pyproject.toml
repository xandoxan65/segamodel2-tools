[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liftkit"
version = "0.1.0"
description = "Multi-ISA disasm → IR → C uplift toolkit (i960 first)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "segamod2" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
gui = ["fastapi>=0.110", "uvicorn>=0.27"]
ai = ["httpx>=0.27"]
dev = ["pytest>=8.0"]

[project.scripts]
liftkit = "liftkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liftkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
